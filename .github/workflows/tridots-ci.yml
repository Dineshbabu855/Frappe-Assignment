# CI workflow for Frappe v15
# Generated by Tridots DevOps
name: "CI - Dineshbabu855/Frappe-Assignment (Frappe v15)"

"on":
  pull_request:
    branches: ["*"]
  push:
    branches: ["*"]

env:
  PYTHON_VERSION: ">=3.14"
  NODE_VERSION: "18"
  FRAPPE_VERSION: "15"
  APP_NAME: "Frappe-Assignment"
  TESTS_DETECTED: "true"

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "${{ env.PYTHON_VERSION }}"
          cache: "${{ (hashFiles('**/requirements.txt', '**/pyproject.toml', '**/setup.py') != '') && 'pip' || '' }}"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "${{ env.NODE_VERSION }}"
          cache: "${{ (hashFiles('**/package-lock.json', '**/yarn.lock', '**/pnpm-lock.yaml') != '') && 'npm' || '' }}"

      - name: Cache bench dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.bench
            ~/.cache/pip
          key: bench-v15-${{ runner.os }}-${{ hashFiles('**/requirements.txt', '**/pyproject.toml', '**/setup.py') }}
          restore-keys: |
            bench-v15-${{ runner.os }}-

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            python3-dev \
            python3-setuptools \
            python3-pip \
            redis-server \
            mariadb-client \
            libmysqlclient-dev \
            cron \
            nginx \
            supervisor

      - name: Install bench
        run: |
          pip install --upgrade pip
          pip install "frappe-bench==15.*"

      - name: Initialize bench
        run: |
          bench init --frappe-version version-15 --python "${{ env.PYTHON_VERSION }}" frappe-bench
          cd frappe-bench
          bench set-config -g redis_cache redis://localhost:6379
          bench set-config -g redis_queue redis://localhost:6379
          bench set-config -g redis_socketio redis://localhost:6379

      - name: Start services
        run: |
          sudo service redis-server start
          sudo service mariadb start
          cd frappe-bench
          bench start &
          sleep 10

      - name: Create test site
        run: |
          cd frappe-bench
          bench new-site test-site --admin-password admin --no-mariadb-socket
          bench use test-site

      - name: Install app
        run: |
          cd frappe-bench
          bench get-app ${{ env.APP_NAME }} ${{ github.server_url }}/${{ github.repository }}.git --branch ${{ github.ref_name }}
          bench --site test-site install-app ${{ env.APP_NAME }}

      - name: Run tests
        if: ${{ env.TESTS_DETECTED == 'true' }}
        run: |
          cd frappe-bench
          bench --site test-site run-tests --app ${{ env.APP_NAME }}

      - name: Lint Python (ruff)
        run: |
          cd frappe-bench/apps/${{ env.APP_NAME }}
          if [ -f pyproject.toml ] || [ -f ruff.toml ] || [ -f .ruff.toml ]; then
            pip install ruff
            ruff check .
          else
            echo "No ruff config found, skipping Python lint"
          fi

      - name: Lint Python (flake8 fallback)
        run: |
          cd frappe-bench/apps/${{ env.APP_NAME }}
          if [ -f setup.cfg ] || [ -f tox.ini ] || [ -f .flake8 ]; then
            pip install flake8
            flake8 .
          else
            echo "No flake8 config found, skipping"
          fi

      - name: Lint JavaScript/TypeScript (eslint)
        if: always()
        run: |
          cd frappe-bench/apps/${{ env.APP_NAME }}
          if [ -f package.json ] && grep -q '"lint"' package.json; then
            npm ci
            npm run lint
          else
            echo "No lint script in package.json, skipping JS lint"
          fi

      - name: Build frontend assets
        if: always()
        run: |
          cd frappe-bench/apps/${{ env.APP_NAME }}
          if [ -f package.json ]; then
            npm ci
            if grep -q '"build"' package.json; then
              npm run build
            else
              echo "No build script in package.json, skipping"
            fi
          else
            echo "No package.json found, skipping frontend build"
          fi


  notify-failure:
    needs: lint-and-test
    if: failure()
    runs-on: ubuntu-latest
    steps:
      - name: Notify on failure
        run: |
          echo "CI pipeline failed for ${{ github.repository }}@${{ github.ref_name }}"
          # Add Slack/email notification here if configured