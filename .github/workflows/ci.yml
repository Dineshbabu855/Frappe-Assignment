name: CI

on:
  pull_request: {}
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.ref }}-${{ github.event.number || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
    name: Server

    services:
      mariadb:
        image: mariadb:10.6
        env:
          MARIADB_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mariadb-admin ping"
          --health-interval=5s
          --health-timeout=2s
          --health-retries=10
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s
          --health-timeout=2s
          --health-retries=10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install MariaDB Client
        run: |
          sudo apt-get update
          sudo apt-get install -y mariadb-client

      - name: Install frappe-bench
        run: |
          pip install frappe-bench

      - name: Initialize bench
        run: |
          bench init --skip-redis-config-generation --skip-assets \
            --frappe-branch "version-15" \
            --python "$(which python)" ~/frappe-bench

      - name: Get app
        working-directory: /home/runner/frappe-bench
        run: |
          bench get-app assignment $GITHUB_WORKSPACE

      - name: Setup requirements
        working-directory: /home/runner/frappe-bench
        run: |
          bench setup requirements --dev

      - name: Create test site
        working-directory: /home/runner/frappe-bench
        run: |
          bench new-site test_site --db-root-password root --admin-password admin

      - name: Install app
        working-directory: /home/runner/frappe-bench
        run: |
          bench --site test_site install-app assignment

      - name: Build assets
        working-directory: /home/runner/frappe-bench
        continue-on-error: true
        run: |
          bench build

      - name: Enable tests
        working-directory: /home/runner/frappe-bench
        run: |
          bench --site test_site set-config allow_tests true

      - name: Run tests
        working-directory: /home/runner/frappe-bench
        run: |
          bench --site test_site run-tests --app assignment --skip-test-records
